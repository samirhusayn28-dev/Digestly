name: Build & Release Digestly Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: ⚙️ Prebuild Native Android Project
        run: |
          cd mobile
          EXPO_NO_TELEMETRY=1 npx expo prebuild --platform android --no-install

      - name: 🐘 Build Release APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-artifacts/Digestly.apk

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Digestly-Android-APK
          path: release-artifacts/Digestly.apk

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "Digestly ${{ github.event.inputs.version || github.ref_name }} - Standalone Android APK"
          body: |
            ## 📱 Digestly — Modern News, Distilled

            Download and install the standalone **Digestly Android APK** directly onto your phone without needing Expo Go or any developer setup.

            ### ✨ What's New in this Upgrade:
            - **Modern Editorial UI:** 100% English interface with new geometric Digestly logo and refined Dark Mode.
            - **Asymmetric Bento Layout:** Top stories featured in a Bento grid on Home with spring scale micro-interactions.
            - **18-Category Taxonomy:** Curate topics across Politics, Business, Finance, Tech, AI, Science, Health, Sports, World, Culture, Food, Automotive, and more.
            - **Bilingual News Content:** Quick toggle between English and Urdu summaries with native RTL text formatting.
            - **Zero Clipping:** Dynamic safe area insets eliminating notch and bottom gesture bar clipping.
            - **Guest Mode & Google Sign-In:** Instant "Continue as Guest" access plus Google account sync.
            - **3-Line AI Summaries:** Groq AI (LLaMA 3.3) synthesis from Dawn, The Express Tribune, and Geo News.
            - **Multi-Source Perspectives:** Compare coverage angles side-by-side across publishers.

            ### 📲 How to Install:
            1. Download `Digestly.apk` below on your Android device.
            2. Tap the downloaded file in your browser or file manager.
            3. If prompted, toggle on *"Allow from this source"* (Install unknown apps).
            4. Tap **Install** and open Digestly!
          files: release-artifacts/Digestly.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
