name: 24/7 Automated News Scraper & AI Summarizer

on:
  schedule:
    # Run every 2 hours (at minute 0)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

concurrency:
  group: news-cron
  cancel-in-progress: true

jobs:
  scrape-and-update:
    name: Scrape All Sources & Update Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: 🚀 Run Digestly News Scraper Pipeline
        working-directory: backend
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'digestly-cbe3c' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyBHiD_YHTJielK4F6Btq5NZ6Oi87EwOaQo' }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: npm run scrape
